; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; SparkFun ICM-20948 library — BLE is bundled with the espressif32 platform
lib_deps =
    sparkfun/SparkFun ICM 20948 IMU Arduino Library @ ^1.2.13

monitor_speed = 115200
